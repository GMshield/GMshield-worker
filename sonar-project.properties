# Read by the pipeline's SonarQube stage. The project key and name come from the pipeline.
# .gmshield-reports/ is the Dockerfile's test-reports stage, copied in by the pipeline.
sonar.sources=gmshield_worker,tools
sonar.tests=tests
sonar.exclusions=gmshield_worker/backend/generated/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
sonar.python.coverage.reportPaths=.gmshield-reports/coverage.xml
sonar.python.xunit.reportPath=.gmshield-reports/junit/TEST-gmshield-worker.xml
