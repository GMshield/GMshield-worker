# Lightweight checks for pull requests into develop. The full pipeline (unit tests, Semgrep, Trivy,
# SonarQube, image, DAST) runs on roberto-server after the merge; this only gives the PR a fast check
# that GitHub can require, together with "branch must be up to date".
name: PR checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: quick-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan of the PR's commits (Gitleaks, same image as the pipeline)
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact --no-banner --verbose --exit-code 1
