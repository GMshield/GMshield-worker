# GMshield pipeline contract (see GMshield-pipeline/templates/pipeline.toml for every option).
# Inactive until a Dockerfile exists; until then only the source checks run.

[service]
name = "worker"
port = 0                    # the worker consumes jobs from Redis and serves no HTTP (no DAST)
health_path = "/"

[build]
test_target = "test"         # Dockerfile stage that runs the unit tests

[dast]
path = "/"
openapi = ""                 # set to the OpenAPI path once it exists, for a ZAP API scan

[deploy]
host_port = 0               # 127.0.0.1:<host_port> on roberto-server (0 = not published)
